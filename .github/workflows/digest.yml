name: Instagram digest

on:
  schedule:
    # 07:00 UTC = 10:00 МСК. Понедельник и четверг.
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python send_digest.py

      - name: Save account snapshot
        run: |
          git config user.name "insta-digest-bot"
          git config user.email "actions@github.com"
          git add account_snapshot.json
          git diff --cached --quiet || git commit -m "Обновить снимок аккаунта"
          git push
